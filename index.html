<style>
@font-face{font-family:"Metropolis";src:url("fonts/Metropolis-Thin.woff2") format("woff2");font-weight:100;font-style:normal;font-display:swap}
@font-face{font-family:"Metropolis";src:url("fonts/Metropolis-ExtraLight.woff2") format("woff2");font-weight:200;font-style:normal;font-display:swap}
@font-face{font-family:"Metropolis";src:url("fonts/Metropolis-Light.woff2") format("woff2");font-weight:300;font-style:normal;font-display:swap}
@font-face{font-family:"Metropolis";src:url("fonts/Metropolis-Regular.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Metropolis";src:url("fonts/Metropolis-Medium.woff2") format("woff2");font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:"Metropolis";src:url("fonts/Metropolis-LightItalic.woff2") format("woff2");font-weight:300;font-style:italic;font-display:swap}
</style>
<style>
:root{
  --bg:#080807;
  --bg-2:#0e0d0c;
  --ink:#f2ece2;
  --sand:#d8c8b0;
  --clay:#a4907a;
  --dim:rgba(242,236,226,.55);
  --line:rgba(242,236,226,.13);
  --line-2:rgba(242,236,226,.07);
  --display:"Metropolis","Montserrat",-apple-system,Helvetica,Arial,sans-serif;
  --sans:"Metropolis","Montserrat",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
  --ease-io:cubic-bezier(.65,0,.35,1);
  --hdr:74px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scrollbar-gutter:stable}
html.lock,body.lock{overflow:hidden}
body{
  background:var(--bg);color:var(--ink);
  font-family:var(--sans);font-weight:300;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
img,video{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
::selection{background:var(--sand);color:var(--bg)}

/* ============ PRELOADER ============ */
#loader{
  position:fixed;inset:0;z-index:1000;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;
  transition:opacity 1s var(--ease),visibility 1s var(--ease);
}
#loader.done{opacity:0;visibility:hidden}
.ld-mark{font-family:var(--display);font-size:clamp(22px,3.6vw,36px);font-weight:200;letter-spacing:.44em;text-indent:.44em}
.ld-bar{width:min(240px,44vw);height:1px;background:rgba(242,236,226,.15);position:relative;overflow:hidden}
.ld-bar i{position:absolute;inset:0;width:0;background:var(--sand);transition:width .3s ease}
.ld-pct{font-size:10px;letter-spacing:.34em;color:var(--clay);font-variant-numeric:tabular-nums}

/* ============ HEADER ============ */
header{
  position:fixed;top:0;left:0;right:0;z-index:60;height:var(--hdr);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 clamp(18px,4vw,50px);
  transition:background .6s var(--ease),backdrop-filter .6s var(--ease),border-color .6s var(--ease);
  border-bottom:1px solid transparent;
}
header.solid{background:rgba(8,8,7,.82);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom-color:var(--line-2)}
header.hide{transform:translateY(-100%);transition:transform .5s var(--ease)}
.brand{font-family:var(--display);font-size:14px;font-weight:400;letter-spacing:.4em;text-indent:.4em;white-space:nowrap}
nav{display:flex;gap:clamp(16px,2.6vw,36px)}
nav a{font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--dim);transition:color .35s;white-space:nowrap}
nav a:hover{color:var(--ink)}
.hd-right{display:flex;align-items:center;gap:clamp(14px,2.4vw,32px)}
.lang{display:flex;align-items:center;gap:7px;font-size:10px;letter-spacing:.18em}
.lang button{color:rgba(242,236,226,.4);transition:color .3s;padding:2px}
.lang button.on{color:var(--ink)}
.lang s{opacity:.25;text-decoration:none}
@media(max-width:900px){nav{display:none}}

/* ============ HERO ============ */
#hero{position:relative;height:100vh;height:100svh;overflow:hidden}
#hero video,#hero .poster{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
}
#hero .poster{background:#c8b09a center/cover no-repeat}
.hero-shade{
  position:absolute;inset:0;
  background:
    linear-gradient(to bottom,rgba(8,8,7,.6) 0%,rgba(8,8,7,.12) 22%,rgba(8,8,7,.3) 55%,rgba(8,8,7,.86) 82%,rgba(8,8,7,.97) 100%),
    radial-gradient(115% 78% at 50% 48%,rgba(8,8,7,.42) 0%,rgba(8,8,7,.12) 42%,rgba(8,8,7,.62) 100%);
}
.hero-mark{
  position:absolute;left:0;right:0;top:50%;transform:translateY(-46%);
  text-align:center;width:100%;padding:0 16px;
}
.hero-mark h1{
  font-family:var(--display);font-weight:200;
  font-size:clamp(44px,12.6vw,208px);line-height:.92;
  letter-spacing:.045em;text-indent:.045em;white-space:nowrap;
  text-shadow:0 10px 90px rgba(8,8,7,.6);
  opacity:0;transform:translateY(26px);
  animation:rise 1.6s var(--ease) .35s forwards;
}
.hero-mark p{
  margin-top:clamp(16px,2.4vw,30px);
  font-size:clamp(9px,.95vw,11.5px);letter-spacing:.42em;text-transform:uppercase;
  color:rgba(242,236,226,.72);
  opacity:0;transform:translateY(18px);
  animation:rise 1.6s var(--ease) .6s forwards;
}
@keyframes rise{to{opacity:1;transform:none}}
.hero-scroll{
  position:absolute;left:50%;bottom:30px;transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;gap:11px;
  font-size:9px;letter-spacing:.34em;text-transform:uppercase;color:rgba(242,236,226,.6);
  opacity:0;animation:rise 1.4s var(--ease) 1.1s forwards;transition:opacity .5s;
}
.hero-scroll.gone{opacity:0!important}
.hero-scroll .rail{width:1px;height:46px;background:rgba(242,236,226,.2);position:relative;overflow:hidden}
.hero-scroll .rail::after{content:"";position:absolute;left:0;width:1px;height:16px;background:var(--ink);animation:trail 2.2s var(--ease-io) infinite}
@keyframes trail{0%{top:-16px}62%,100%{top:46px}}

/* ============ SECTIONS ============ */
.wrap{max-width:1420px;margin:0 auto;padding:0 clamp(18px,4vw,50px)}
.eyebrow{font-size:9px;letter-spacing:.38em;text-transform:uppercase;color:var(--clay);margin-bottom:24px}
h2{font-family:var(--display);font-weight:200;font-size:clamp(30px,4.5vw,62px);line-height:1.08;letter-spacing:-.012em}
h2 em{font-style:italic;color:var(--sand)}
.lead{font-size:clamp(14px,1.15vw,16.5px);line-height:1.8;color:var(--dim);max-width:54ch}
.rv{opacity:0;transform:translateY(30px);transition:opacity 1.1s var(--ease),transform 1.1s var(--ease)}
.rv.in{opacity:1;transform:none}

.intro{padding:clamp(100px,15vh,190px) 0}
.intro + .intro{padding-top:0}
.intro-grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(28px,6vw,90px);align-items:end}
@media(max-width:900px){.intro-grid{grid-template-columns:1fr;align-items:start;gap:30px}}
.specs{margin-top:56px;border-top:1px solid var(--line);grid-column:1/-1}
.spec{display:grid;grid-template-columns:34px 200px 1fr;gap:20px;padding:22px 0;border-bottom:1px solid var(--line)}
.spec b{font-family:var(--display);font-weight:400;font-size:13px;color:var(--clay);font-variant-numeric:tabular-nums}
.spec h4{font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:500}
.spec p{font-size:14px;line-height:1.7;color:var(--dim)}
@media(max-width:760px){.spec{grid-template-columns:30px 1fr;gap:8px 16px}.spec p{grid-column:2}}

/* ============ CATALOG GRID ============ */
#catalog{padding:clamp(60px,8vh,110px) 0 0}
.cat-head{display:flex;justify-content:space-between;align-items:flex-end;gap:26px;margin-bottom:clamp(32px,5vh,56px)}
.grid{
  display:grid;grid-template-columns:repeat(5,1fr);
  border-top:1px solid var(--line-2);border-left:1px solid var(--line-2);
}
@media(max-width:1360px){.grid{grid-template-columns:repeat(4,1fr)}}
@media(max-width:1040px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:720px){.grid{grid-template-columns:repeat(2,1fr)}}
.cell{
  position:relative;aspect-ratio:4/3;overflow:hidden;
  border-right:1px solid var(--line-2);border-bottom:1px solid var(--line-2);
  background:var(--bg-2);cursor:pointer;
}
.cell img{
  width:100%;height:100%;object-fit:cover;
  transform:scale(.82);opacity:.78;
  transition:transform .9s var(--ease),opacity .6s var(--ease);
  backface-visibility:hidden;
}
.cell:hover img{will-change:transform}
.cell:hover img{transform:scale(.92);opacity:1}
.cell::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:52%;pointer-events:none;
  background:linear-gradient(to top,rgba(8,8,7,.85),rgba(8,8,7,.35) 45%,transparent);
  opacity:0;transition:opacity .55s var(--ease);
}
.cell:hover::after{opacity:1}
.cell .lbl,.cell .tag{z-index:2}
.cell .lbl{
  position:absolute;left:0;right:0;bottom:16px;text-align:center;
  font-family:var(--display);font-weight:300;font-size:clamp(13px,1.15vw,17px);letter-spacing:.3em;text-indent:.3em;
  opacity:0;transform:translateY(8px);transition:opacity .5s var(--ease),transform .5s var(--ease);
  pointer-events:none;text-shadow:0 2px 20px rgba(0,0,0,.6);
}
.cell .tag{
  position:absolute;left:0;right:0;bottom:16px;text-align:center;
  font-size:8.5px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--sand);opacity:0;transform:translateY(8px);
  transition:opacity .5s var(--ease) .05s,transform .5s var(--ease) .05s;pointer-events:none;
  text-shadow:0 2px 16px rgba(0,0,0,.7);
}
.cell:hover .lbl{opacity:1;transform:translateY(-18px)}
.cell:hover .tag{opacity:1;transform:none}
.cell.hidden{visibility:hidden}

/* fabrics of the same model, inside the panel */
.sibs{margin-bottom:30px}
.sibs-h{font-size:9px;letter-spacing:.28em;text-transform:uppercase;color:var(--clay);margin-bottom:14px}
.sibs-row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start}
.sib{width:74px;text-align:left;display:flex;flex-direction:column}
.sib img{
  width:74px;height:56px;object-fit:cover;
  filter:saturate(.85) brightness(.8);transition:filter .45s var(--ease),transform .45s var(--ease);
  border:1px solid transparent;
}
.sib:hover img{filter:none;transform:translateY(-2px);border-color:var(--line)}
.sib span{display:block;margin-top:7px;font-size:8.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);line-height:1.35}
.sib:hover span{color:var(--ink)}

.pv-stage.swapping .shot{opacity:0!important}
.pv-panel.restage > *{animation:none;opacity:0;transform:translateY(14px)}
.pv-panel.restage > *{animation:pin .7s var(--ease) forwards}

/* ============ CONTACT ============ */
#contact{padding:clamp(90px,13vh,170px) 0 60px}
.contact-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(28px,5vw,80px)}
@media(max-width:900px){.contact-grid{grid-template-columns:1fr;gap:44px}}
form{display:flex;flex-direction:column;gap:26px;margin-top:40px}
.field{position:relative}
.field input,.field textarea{
  width:100%;background:none;border:0;border-bottom:1px solid var(--line);
  padding:13px 0;color:var(--ink);font-family:var(--sans);font-size:15px;font-weight:300;
  outline:none;transition:border-color .4s;resize:none;
}
.field input:focus,.field textarea:focus{border-color:var(--sand)}
.field label{
  position:absolute;left:0;top:13px;pointer-events:none;font-size:15px;color:rgba(242,236,226,.35);
  transition:transform .35s var(--ease),font-size .35s,color .35s,letter-spacing .35s;transform-origin:left top;
}
.field input:focus+label,.field input:not(:placeholder-shown)+label,
.field textarea:focus+label,.field textarea:not(:placeholder-shown)+label{
  transform:translateY(-23px);font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--clay);
}
.btn{
  align-self:flex-start;border:1px solid var(--line);padding:16px 40px;
  font-size:10px;letter-spacing:.28em;text-transform:uppercase;
  transition:background .45s var(--ease),color .45s var(--ease),border-color .45s var(--ease);
}
.btn:hover{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ok{font-size:13px;color:var(--sand);display:none}
.info-row{padding:19px 0;border-bottom:1px solid var(--line)}
.info-row:last-child{border-bottom:0}
.info-row small{display:block;font-size:9px;letter-spacing:.28em;text-transform:uppercase;color:var(--clay);margin-bottom:8px}
.info-row a,.info-row p{font-family:var(--display);font-size:18px;font-weight:300;letter-spacing:.01em;transition:color .35s}
.info-row a:hover{color:var(--sand)}
footer{padding:34px 0 40px;border-top:1px solid var(--line-2)}
.foot{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:rgba(242,236,226,.32)}

/* ============ PRODUCT VIEW ============ */
#product{
  position:fixed;inset:0;z-index:80;visibility:hidden;pointer-events:none;
}
#product.on,#product.closing{visibility:visible}
#product.on{pointer-events:auto}
#product.closing{pointer-events:none}
/* при закрытии гаснет вся карточка целиком, включая тёмный блок сцены */
#product.closing{opacity:0;transition:opacity .4s var(--ease)}
#product.closing .pv-panel{transform:translateX(100%);transition:transform .5s var(--ease)}
#product.closing .pv-nav{opacity:0;transition:opacity .2s var(--ease)}
/* фото убираем сразу — его роль на закрытии играет летящий клон,
   тогда гаснет только дешёвая заливка, а не картинка 1800px */
#product.closing .pv-stage .shot{opacity:0!important;transition:none}
.pv-bg{
  position:absolute;inset:0;background:var(--bg);
  opacity:0;transition:opacity .34s var(--ease);
}
#product.on .pv-bg{opacity:1}
.pv-stage{
  position:absolute;left:0;top:0;bottom:0;width:62%;
  overflow:hidden;background:var(--bg-2);
}
@media(max-width:900px){.pv-stage{position:relative;width:100%;height:56svh}}
.pv-stage .shot{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  opacity:0;transition:opacity .5s var(--ease);
  backface-visibility:hidden;
}
.pv-stage .shot.show{opacity:1}
/* кадр всегда проявляется плавно */
.pv-stage .shot.show{transition:opacity .5s var(--ease)}
.pv-stage::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to right,rgba(8,8,7,.28),transparent 30%,transparent 72%,rgba(8,8,7,.4));
}
/* FLIP clone */
#flip{
  position:fixed;z-index:90;overflow:hidden;pointer-events:none;opacity:0;background:var(--bg-2);
  transform-origin:50% 50%;will-change:transform,opacity;backface-visibility:hidden;
}
#flip img{width:100%;height:100%;object-fit:cover;backface-visibility:hidden}

.pv-nav{
  position:absolute;left:0;right:0;bottom:0;z-index:3;
  opacity:0;transform:translateY(12px);transition:opacity .5s var(--ease),transform .5s var(--ease);
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:20px clamp(16px,2.4vw,30px);
}
#product.on .pv-nav{opacity:1;transform:none;transition-delay:.28s}
.modes{display:flex;gap:2px;border:1px solid var(--line);border-radius:0;overflow:hidden;background:rgba(8,8,7,.45);backdrop-filter:blur(10px)}
.modes button{
  padding:10px 18px;font-size:9px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--dim);transition:background .4s var(--ease),color .4s var(--ease);
}
.modes button.on{background:var(--ink);color:var(--bg)}
.dots{display:flex;gap:7px;align-items:center}
.dots i{width:16px;height:1px;background:rgba(242,236,226,.28);transition:background .4s,width .4s var(--ease);cursor:pointer;display:block}
.dots i.on{background:var(--ink);width:28px}
.arrows{display:flex;gap:8px}
.arrows button{
  width:38px;height:38px;border:1px solid var(--line);display:grid;place-items:center;
  transition:background .4s var(--ease),color .4s var(--ease),border-color .4s;
  background:rgba(8,8,7,.45);backdrop-filter:blur(10px);
}
.arrows button:hover{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.arrows svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.2}

.pv-panel{
  position:absolute;right:0;top:0;bottom:0;width:38%;
  padding:calc(var(--hdr) + 26px) clamp(22px,2.6vw,48px) 40px;
  overflow-y:auto;overscroll-behavior:contain;
  border-left:1px solid var(--line-2);
  transform:translateX(100%);transition:transform .7s var(--ease);
  background:var(--bg);
}
#product.on .pv-panel{transform:none;transition:transform .75s var(--ease) .34s}
@media(max-width:900px){
  .pv-panel{position:relative;width:100%;height:auto;padding:26px 18px 60px;border-left:0;border-top:1px solid var(--line-2);transform:translateY(40px);opacity:0;transition:transform .7s var(--ease),opacity .7s var(--ease)}
  #product.on .pv-panel{transform:none;opacity:1}
  #product.on{overflow-y:auto}
}
.pv-scroll{position:absolute;inset:0;overflow-y:auto}
@media(max-width:900px){.pv-scroll{position:static;overflow:visible}}

.pv-panel > *{opacity:0;transform:translateY(16px)}
#product.on .pv-panel > *{animation:pin .8s var(--ease) forwards}
@keyframes pin{to{opacity:1;transform:none}}
#product.on .pv-panel > *:nth-child(1){animation-delay:0.50s}
#product.on .pv-panel > *:nth-child(2){animation-delay:0.57s}
#product.on .pv-panel > *:nth-child(3){animation-delay:0.64s}
#product.on .pv-panel > *:nth-child(4){animation-delay:0.71s}
#product.on .pv-panel > *:nth-child(5){animation-delay:0.78s}
#product.on .pv-panel > *:nth-child(6){animation-delay:0.85s}
#product.on .pv-panel > *:nth-child(7){animation-delay:0.92s}
#product.on .pv-panel > *:nth-child(8){animation-delay:0.99s}
#product.on .pv-panel > *:nth-child(9){animation-delay:1.06s}
#product.on .pv-panel > *:nth-child(n+10){animation-delay:1.13s}

.pv-tag{font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:var(--clay)}
.pv-title{font-family:var(--display);font-weight:200;font-size:clamp(30px,3vw,48px);line-height:1;letter-spacing:.1em;margin:14px 0 8px}
.pv-lead{font-family:var(--display);font-weight:300;font-style:italic;font-size:clamp(15px,1.25vw,18px);color:var(--sand);letter-spacing:.005em;margin-bottom:26px}
.pv-text{font-size:14.5px;line-height:1.8;color:var(--dim);margin-bottom:20px}
.pv-scene{font-size:12.5px;line-height:1.7;color:rgba(242,236,226,.36);padding-left:14px;border-left:1px solid var(--line);margin-bottom:32px}
.acc{border-top:1px solid var(--line)}
.acc:last-of-type{border-bottom:1px solid var(--line)}
.acc-h{
  width:100%;display:flex;justify-content:space-between;align-items:center;gap:16px;
  padding:19px 0;font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;text-align:left;
}
.acc-h span.pl{position:relative;width:11px;height:11px;flex:none;opacity:.6;transition:transform .5s var(--ease),opacity .3s}
.acc-h span.pl::before,.acc-h span.pl::after{content:"";position:absolute;background:currentColor;transition:opacity .4s}
.acc-h span.pl::before{left:0;top:5px;width:11px;height:1px}
.acc-h span.pl::after{left:5px;top:0;width:1px;height:11px}
.acc.open .acc-h span.pl{transform:rotate(90deg);opacity:1}
.acc.open .acc-h span.pl::after{opacity:0}
.acc-b{max-height:0;overflow:hidden;transition:max-height .6s var(--ease)}
.acc-b-in{padding-bottom:24px}
.prow{display:flex;justify-content:space-between;gap:16px;padding:9px 0;font-size:13.5px;color:var(--dim);border-bottom:1px solid var(--line-2)}
.prow:last-child{border-bottom:0}
.prow b{font-weight:400;color:var(--ink);font-variant-numeric:tabular-nums}
.note{font-size:12px;line-height:1.65;color:rgba(242,236,226,.34);margin-top:14px}
.pv-cta{margin-top:30px}

.pv-back{
  position:fixed;left:clamp(16px,2.4vw,30px);top:calc(var(--hdr) + 14px);z-index:95;
  display:flex;align-items:center;gap:11px;
  font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim);
  opacity:0;pointer-events:none;transition:opacity .5s var(--ease) .25s,color .35s,background .35s;
  padding:11px 18px 11px 14px;background:rgba(8,8,7,.5);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid var(--line);
}
#product.on ~ .pv-back,.pv-back.on{opacity:1;pointer-events:auto}
.pv-back:hover{color:var(--ink);background:rgba(8,8,7,.78)}
.pv-back svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.2}
@media(max-width:900px){
  .pv-back{top:calc(var(--hdr) + 10px);left:12px;padding:10px 15px 10px 11px;font-size:9px}
  .modes button{padding:9px 13px;font-size:8.5px;white-space:nowrap}
  .pv-nav{padding:14px 12px;gap:10px}
  .arrows button{width:34px;height:34px}
  .dots{display:none}
}

@media(prefers-reduced-motion:reduce){
  .rv{opacity:1;transform:none}
  *{animation-duration:.01ms!important;transition-duration:.12s!important}
}
</style>
</head>
<body>

<div id="loader">
  <div class="ld-mark">KYE ROOM</div>
  <div class="ld-bar"><i id="lb"></i></div>
  <div class="ld-pct" id="lp">0%</div>
</div>

<header id="hdr">
  <a href="#top" class="brand">KYE ROOM</a>
  <nav>
    <a href="#about" data-t="nav_about">Бренд</a>
    <a href="#craft" data-t="nav_craft">Производство</a>
    <a href="#catalog" data-t="nav_catalog">Каталог</a>
    <a href="#contact" data-t="nav_contact">Контакты</a>
  </nav>
  <div class="hd-right">
    <div class="lang">
      <button data-lang="ru" class="on">RU</button><s>/</s><button data-lang="en">EN</button>
    </div>
  </div>
</header>

<span id="top"></span>

<section id="hero">
  <video id="hv" autoplay muted loop playsinline preload="auto" poster="media/hero-poster.jpg">
    <source src="media/hero.mp4" type="video/mp4">
  </video>
  <div class="hero-shade"></div>
  <div class="hero-mark">
    <h1>KYE ROOM</h1>
    <p id="heroSub">Не просто мебель — произведение искусства</p>
  </div>
  <div class="hero-scroll" id="hs"><span data-t="scroll">Листайте</span><div class="rail"></div></div>
</section>

<section class="intro" id="about"><div class="wrap intro-grid" id="intro0"></div></section>
<section class="intro" id="craft"><div class="wrap intro-grid" id="intro1"></div></section>

<section id="catalog">
  <div class="wrap">
    <div class="cat-head rv">
      <div>
        <div class="eyebrow" data-t="nav_catalog">Каталог</div>
        <h2 data-t="catalog_title">Каталог</h2>
      </div>
      <p class="lead" style="max-width:32ch" data-t="catalog_note">Шестнадцать позиций.</p>
    </div>
  </div>
  <div class="grid" id="grid"></div>
</section>

<section id="contact">
  <div class="wrap contact-grid">
    <div>
      <div class="eyebrow rv" data-t="nav_contact">Контакты</div>
      <h2 class="rv" id="contactH">Соберём вашу<br><em>кровать</em></h2>
      <form class="rv" id="f">
        <div class="field"><input type="text" id="fn" placeholder=" " required><label for="fn" data-t="form_name">Имя</label></div>
        <div class="field"><input type="tel" id="fp" placeholder=" " required><label for="fp" data-t="form_phone">Телефон</label></div>
        <div class="field"><textarea id="fm" rows="2" placeholder=" "></textarea><label for="fm" data-t="form_msg">Модель, размер, ткань</label></div>
        <button type="submit" class="btn" data-t="form_send">Отправить</button>
        <div class="ok" id="ok" data-t="form_ok">Спасибо.</div>
      </form>
    </div>
    <div class="rv" id="cInfo"></div>
  </div>
</section>

<footer><div class="wrap foot"><small>© 2026 KYE ROOM</small><small id="footR">Мебель ручной работы</small></div></footer>

<!-- ============ PRODUCT VIEW ============ -->
<div id="product">
  <div class="pv-bg"></div>
  <div class="pv-stage" id="stage">
    <div class="pv-nav">
      <div class="modes" id="modes">
        <button data-mode="nature" class="on" data-t="view_nature">На природе</button>
        <button data-mode="room" data-t="view_room">В интерьере</button>
      </div>
      <div class="dots" id="dots"></div>
      <div class="arrows">
        <button id="prev" aria-label="prev"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
        <button id="next" aria-label="next"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
      </div>
    </div>
  </div>
  <aside class="pv-panel" id="panel"></aside>
</div>
<button class="pv-back" id="back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg><span data-t="back">К каталогу</span></button>

<div id="flip"><img alt=""></div>

<script src="data.js"></script>
<script src="media.js"></script>
<script src="app.js"></script>
</body>
</html>
